<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Laboratorio · Sophilux B — Propuesta visual V1</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="previewbar" role="region" aria-label="Controles del prototipo visual">
    <div class="previewbar-inner">
      <div class="preview-caption"><span class="preview-dot"></span><span>PROTOTIPO VISUAL <b>V1</b></span><small>Propuesta · no es la aplicación</small></div>
      <nav class="prototype-nav" aria-label="Cambiar pantalla de ejemplo" id="prototype-nav"></nav>
    </div>
  </div>
  <div class="app-shell">
    <header class="sitebar" role="banner">
      <div class="sitebar-inner">
        <div class="brand" aria-label="Laboratorio de Privacidad Clínica">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 38 44" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 2 35 8v12c0 10-6.8 17.1-16 22C9.8 37.1 3 30 3 20V8L19 2Z" stroke="currentColor" stroke-width="1.9"/><path d="M19 7v29M7 19h24" stroke="currentColor" stroke-width="1.4"/><path d="M19 7 8 11v8h11V7ZM19 19v17c6-3.7 11-8.4 11-17H19Z" fill="currentColor" opacity=".14"/></svg>
          </div>
          <div><div class="brand-name">Laboratorio <span>de Privacidad</span></div><div class="brand-sub">CLÍNICA · SOPHILUX</div></div>
        </div>
        <div class="sitebar-context"><span class="status-pip"></span><span>Procesamiento local</span><span class="sitebar-context-sep"></span><span id="current-job-label">Sin trabajo activo</span></div>
        <div class="sitebar-actions"><button type="button" class="quiet-btn" data-action="new">Nuevo trabajo</button><button type="button" class="icon-btn" aria-label="Ayuda contextual" data-action="help">?</button></div>
      </div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <footer class="app-footer"><div class="footer-inner"><span>Laboratorio de Privacidad Clínica <span class="footer-heart">✧</span> Un espacio de trabajo con criterio</span><span><span class="status-pip"></span> Demostración con contenido sintético · no procesa datos reales</span></div></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
