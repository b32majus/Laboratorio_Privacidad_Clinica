name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Smoke check entrypoints (T25 #29: canonical V4 entry; legacy pages retired)
        run: |
          test -f index.html
          test -f app-v4/index.html
          test -f render.yaml

      - name: Build V4 app (legacy Tailwind + Vite)
        run: npm run build

      # Keep the complete local npm test contract in CI. Previously CI
      # duplicated 13 of its 18 scripts and silently omitted five.
      # Build first: source/dist guards inspect the generated V4 bundle.
      - name: Canonical npm test (all project checks and V4 Vitest)
        run: npm test

      - name: Adversarial oracle self-tests (planted violations)
        run: |
          npm run check:external:selftest
          npm run check:pdfjs:selftest
          npm run check:storage:selftest
          npm run check:release-qa:selftest

      - name: Check V4 formatting
        run: npm run format:check:v4

      - name: Typecheck V4 app
        run: npm run typecheck:v4

      - name: Lint V4 app
        run: npm run lint:v4

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production-like static bundle
        run: npm run build

      - name: Run critical Playwright E2E suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
