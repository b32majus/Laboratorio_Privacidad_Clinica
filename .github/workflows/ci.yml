name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Check HTML local links
        run: node scripts/ci/check-links.mjs

      - name: Check sensitive storage policy
        run: node scripts/ci/check-storage-policy.mjs

      - name: Positioning copy claims
        run: npm run check:positioning

      - name: Smoke anonymization
        run: node scripts/ci/smoke-anonymization.mjs

      - name: "Contract tests: ReviewSession domain"
        run: npm run test:domain

      - name: "Unit tests: privacy-eval matcher and metrics"
        run: npm run test:privacy-eval

      - name: Privacy regression harness (ground-truth corpus)
        run: npm run check:privacy-eval

      - name: "Ground-truth V4 gate (FUNC-008 + QA-001, real V4 engine + AGE)"
        run: npm run check:privacy-eval:v4

      - name: Smoke check entrypoints (T25 #29: canonical V4 entry; legacy pages retired)
        run: |
          test -f index.html
          test -f app-v4/index.html
          test -f render.yaml

      - name: Build V4 app (legacy Tailwind + Vite)
        run: npm run build

      - name: Check V4 external resources
        run: npm run check:external

      - name: Check vendor manifest integrity
        run: npm run check:vendor

      - name: Check PDF.js eval guard (CVE-2024-4367)
        run: npm run check:pdfjs

      - name: Adversarial oracle self-tests (planted violations)
        run: |
          npm run check:external:selftest
          npm run check:pdfjs:selftest
          npm run check:storage:selftest

      - name: Check V4 formatting
        run: npm run format:check:v4

      - name: Typecheck V4 app
        run: npm run typecheck:v4

      - name: Lint V4 app
        run: npm run lint:v4

      - name: Test V4 app
        run: npm run test:v4

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production-like static bundle
        run: npm run build

      - name: Run critical Playwright E2E suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
