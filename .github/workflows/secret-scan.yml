name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          ARCHIVE=gitleaks_8.30.1_linux_x64.tar.gz
          EXPECTED_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          printf '%s  %s\n' "${EXPECTED_SHA256}" "${RUNNER_TEMP}/${ARCHIVE}" > "${RUNNER_TEMP}/gitleaks.sha256"
          sha256sum --check "${RUNNER_TEMP}/gitleaks.sha256"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"

      - name: Scan commits for secrets
        shell: bash
        env:
          SCAN_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${SCAN_PR_BASE:-}" ]; then
              echo "No pull request base sha available; failing closed." >&2
              exit 1
            fi
            merge_base="$(git merge-base "${SCAN_PR_BASE}" HEAD)"
            range="${merge_base}..HEAD"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            zero_sha="0000000000000000000000000000000000000000"
            if [ -z "${SCAN_PUSH_BEFORE:-}" ] \
              || [ "${SCAN_PUSH_BEFORE}" = "${zero_sha}" ] \
              || ! git cat-file -e "${SCAN_PUSH_BEFORE}^{commit}" 2>/dev/null; then
              # On a newly created branch, compare against the canonical
              # product branch; do not repeatedly fail on historical findings.
              # Missing base or unrelated histories fail closed under -e.
              git fetch --no-tags origin "refs/heads/3.0-main:refs/remotes/origin/3.0-main"
              base="$(git merge-base "origin/3.0-main" HEAD)"
              range="${base}..HEAD"
            else
              range="${SCAN_PUSH_BEFORE}..HEAD"
            fi
          else
            echo "Unsupported GitHub event for secret scan; failing closed." >&2
            exit 1
          fi
          echo "Scanning commits in range: ${range}"
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="${range}" .
